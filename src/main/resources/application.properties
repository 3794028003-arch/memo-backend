spring.application.name=memo-backend
spring.datasource.url=jdbc:postgresql://postgres:5432/memo_db
spring.datasource.username=memo
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.docker.compose.enabled=false

jwt.secret=${JWT_SECRET:development-only-jwt-secret-key-must-be-at-least-32-bytes}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:1800000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
