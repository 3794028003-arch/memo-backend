name: Memo Backend CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master


jobs:
  build:

    runs-on: ubuntu-latest


    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_DB: memo_db
          POSTGRES_USER: memo
          POSTGRES_PASSWORD: 123456

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    steps:

      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4


      # 2. 安装 Java
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'


      # 3. 测试
      - name: Run Tests
        run: ./mvnw test


      # 4. 打包
      - name: Build Application
        run: ./mvnw clean package -DskipTests


      # 5. 构建 Docker 镜像
      - name: Build Docker Image
        run: docker build -t memo-backend .


      # 6. 登录 Docker Hub
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}


      # 7. 给镜像打标签
      - name: Tag Docker Image
        run: |
          docker tag memo-backend \
          ${{ secrets.DOCKER_USERNAME }}/memo-backend:latest


      # 8. 上传镜像
      - name: Push Docker Image
        run: |
          docker push \
          ${{ secrets.DOCKER_USERNAME }}/memo-backend:latest