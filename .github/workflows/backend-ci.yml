name: Memo Backend CI


on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master


jobs:

  build:

    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: memo_db
          POSTGRES_USER: memo
          POSTGRES_PASSWORD: 123456

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

    # 1. 拉取代码
    - name: Checkout code
      uses: actions/checkout@v4


    # 2. 安装 Java
    - name: Setup JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'


    # 3. 测试
    - name: Run Tests
      run: ./mvnw test


    # 4. 打包
    - name: Build Application
      run: ./mvnw clean package -DskipTests